name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review re-runs checks when a draft is marked ready (see wip-docs below).
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Reported, not blocking: Next 14 has known advisories that only affect a running
      # Next server. Production is a static export, so they're accepted in ADR 0001.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  wip-docs:
    name: No branch-only docs
    # docs/wip/ holds working notes for a branch (e.g. provenance of ported code). They're fine
    # while a PR is a draft and must be deleted before it's marked ready and merged.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Fail if docs/wip/ exists
        run: |
          if [ -d docs/wip ]; then
            echo "::error::docs/wip/ contains branch-only notes. Delete it before this PR leaves draft."
            ls -R docs/wip
            exit 1
          fi
